name: Feature request
description: Propose an evidence-backed public feature.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the proposed public behavior using public or synthetic information only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Affected public example
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and failure criteria
    validations:
      required: true
