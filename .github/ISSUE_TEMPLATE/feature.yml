name: Feature request
description: Propose an evidence-backed public feature.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the decision or validation problem, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Public and protected boundary
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and failure criteria
    validations:
      required: true
