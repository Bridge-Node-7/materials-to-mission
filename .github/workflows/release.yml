name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify signed annotated tag and version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_object="$(printf '%s' "$ref_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          target="$(printf '%s' "$tag_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          verified="$(printf '%s' "$tag_json" | python -c 'import json,sys; print(str(json.load(sys.stdin)["verification"]["verified"]).lower())')"
          test "$target" = "$GITHUB_SHA"
          test "$verified" = "true"
      - name: Install locked dependencies and validate
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/check_repo.py
          git diff --exit-code
          rm -rf dist
          M2M_RELEASE_MODE=candidate python scripts/build_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/release-manifest.json").read_text())
          assert data["git_bound"] is True
          assert data["tag"] == f"v{data['version']}"
          assert data["commit"]
          assert data["tree"]
          PY
      - name: Seal release candidate handoff
        shell: bash
        run: |
          set -euo pipefail
          notes_file="RELEASE_NOTES.md"
          archive="dist/materials-to-mission-${GITHUB_REF_NAME}.zip"
          test -s "$notes_file"
          test -s "$archive"
          test -s dist/SHA256SUMS
          test -s dist/release-manifest.json
          test -s REPO_FILE_MANIFEST.sha256
          test -s VALIDATION_REPORT.md
          sha256sum \
            "$archive" \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            REPO_FILE_MANIFEST.sha256 \
            VALIDATION_REPORT.md \
            "$notes_file" \
            > dist/RELEASE_CANDIDATE_SHA256SUMS
          sha256sum -c dist/RELEASE_CANDIDATE_SHA256SUMS
      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2m-stable-release-candidate
          path: |
            dist/materials-to-mission-${{ github.ref_name }}.zip
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/RELEASE_CANDIDATE_SHA256SUMS
            REPO_FILE_MANIFEST.sha256
            VALIDATION_REPORT.md
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2m-stable-release-candidate
          path: candidate
      - name: Verify sealed candidate and tag identity
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c dist/RELEASE_CANDIDATE_SHA256SUMS
          manifest_tag="$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["tag"])')"
          test "$manifest_tag" = "$GITHUB_REF_NAME"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_object="$(printf '%s' "$ref_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          target="$(printf '%s' "$tag_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          verified="$(printf '%s' "$tag_json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["verification"]["verified"]).lower())')"
          test "$target" = "$GITHUB_SHA"
          test "$verified" = "true"
      - name: Create draft release, attach exact allowlist, then publish
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          version="$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          notes_file="RELEASE_NOTES.md"
          archive="dist/materials-to-mission-${GITHUB_REF_NAME}.zip"
          test -f "$notes_file"
          test -f "$archive"
          release_title="$(sed -n '1s/^# //p' "$notes_file")"
          expected_title_prefix="Materials-to-Mission ${GITHUB_REF_NAME}"
          test -n "$release_title"
          case "$release_title" in
            "$expected_title_prefix"|"$expected_title_prefix — "*|"$expected_title_prefix - "*)
              ;;
            *)
              echo "Unsupported release title: $release_title" >&2
              exit 1
              ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "$release_title" \
            --notes-file "$notes_file"
          gh release upload "${GITHUB_REF_NAME}" \
            "$archive" \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            REPO_FILE_MANIFEST.sha256 \
            VALIDATION_REPORT.md
          expected="$(printf '%s\n' REPO_FILE_MANIFEST.sha256 SHA256SUMS VALIDATION_REPORT.md "materials-to-mission-${GITHUB_REF_NAME}.zip" release-manifest.json | sort)"
          observed="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
          test "$observed" = "$expected"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          immutable="false"
          for attempt in $(seq 1 12); do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.immutable')"
            [[ "$immutable" == "true" ]] && break
            sleep 5
          done
          test "$immutable" = "true"
