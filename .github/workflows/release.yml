name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify signed annotated tag and version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_object="$(printf '%s' "$ref_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          target="$(printf '%s' "$tag_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          verified="$(printf '%s' "$tag_json" | python -c 'import json,sys; print(str(json.load(sys.stdin)["verification"]["verified"]).lower())')"
          test "$target" = "$GITHUB_SHA"
          test "$verified" = "true"
      - name: Install locked dependencies and validate
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/check_repo.py
          git diff --exit-code
          rm -rf dist
          M2M_RELEASE_MODE=candidate python scripts/build_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dist/release-manifest.json').read_text())
          assert data['git_bound'] is True
          assert data['tag'] == 'v0.1.0'
          assert data['commit']
          assert data['tree']
          PY
      - name: Create draft release, attach exact allowlist, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "Materials-to-Mission ${GITHUB_REF_NAME} — Experimental Public Method Baseline" \
            --notes-file RELEASE_NOTES_v0.1.0.md
          gh release upload "${GITHUB_REF_NAME}" \
            dist/materials-to-mission-v0.1.0.zip \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            REPO_FILE_MANIFEST.sha256 \
            VALIDATION_REPORT.md
          expected="$(printf '%s\n' REPO_FILE_MANIFEST.sha256 SHA256SUMS VALIDATION_REPORT.md materials-to-mission-v0.1.0.zip release-manifest.json | sort)"
          observed="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
          test "$observed" = "$expected"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          immutable="false"
          for attempt in $(seq 1 12); do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.immutable')"
            [[ "$immutable" == "true" ]] && break
            sleep 5
          done
          test "$immutable" = "true"
