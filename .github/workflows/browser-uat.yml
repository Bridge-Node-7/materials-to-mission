name: Materials-to-Mission Browser UAT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-uat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked browser dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-browser.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m playwright install --with-deps chromium
          python scripts/check_repo.py
          git diff --exit-code
          python scripts/build_web.py --output build/web
      - name: Run browser UAT
        shell: bash
        run: |
          set -euo pipefail
          python scripts/serve_preview.py --directory build/web --port 8765 >build/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/browser_uat.py --base-url http://127.0.0.1:8765/ --evidence build/browser-uat
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m2m-browser-uat
          path: |
            build/browser-uat/
            build/http.log
          if-no-files-found: error
          retention-days: 14
