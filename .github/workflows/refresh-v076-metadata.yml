name: M2M v0.7.6 metadata refresh

on:
  push:
    branches:
      - hardening/no-js-boundary-v0.7.6

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'M2M v0.7.6 — refresh release metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Refresh, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CITATION.cff')
          text=p.read_text(encoding='utf-8')
          text=text.replace('date-released: 2026-08-22','date-released: 2026-09-13')
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
          tmpdir="$(mktemp -d)"
          mv .github/workflows/refresh-v076-metadata.yml "$tmpdir/"
          git add -A
          python scripts/check_repo.py --update-evidence
          python scripts/check_repo.py
          python -m pytest
          mv "$tmpdir/refresh-v076-metadata.yml" .github/workflows/
          rmdir "$tmpdir"
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'M2M v0.7.6 — refresh release metadata'
          git push origin HEAD:hardening/no-js-boundary-v0.7.6
