name: M2M v0.7.6 bounded closeout

on:
  push:
    branches:
      - hardening/no-js-boundary-v0.7.6

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Release v0.7.6 — preserve no-JavaScript evidence path'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Apply, validate, and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/closeout_nojs_v076.py
          tmpdir="$(mktemp -d)"
          mv scripts/closeout_nojs_v076.py "$tmpdir/"
          mv .github/workflows/closeout-v076.yml "$tmpdir/"
          git add -A
          python scripts/check_repo.py --update-evidence
          python scripts/check_repo.py
          python -m pytest
          mv "$tmpdir/closeout_nojs_v076.py" scripts/
          mv "$tmpdir/closeout-v076.yml" .github/workflows/
          rmdir "$tmpdir"
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release v0.7.6 — preserve no-JavaScript evidence path'
          git push origin HEAD:hardening/no-js-boundary-v0.7.6
