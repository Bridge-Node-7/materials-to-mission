name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Privacy path scan
        run: python scripts/check_privacy.py
      - name: Prepare expected repository manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/m2m-manifest"
          python scripts/build_manifest.py
          cp REPO_FILE_MANIFEST.sha256 "${RUNNER_TEMP}/m2m-manifest/"
          git checkout -- REPO_FILE_MANIFEST.sha256
      - name: Follow documented consumer path and prove FMA interoperability
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .consumer-venv
          source .consumer-venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(m2m --version)" = "m2m ${EXPECTED_VERSION}"
          python scripts/evaluate_public_method.py
          mkdir -p build
          m2m validate \
            examples/synthetic-critical-material-pathway/case.json \
            --public \
            --profile m0-strict-0.4.0 \
            --json > build/consumer-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/consumer-validation.json").read_text())
          assert data["valid"] is True
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert data["toolkit_version"] == expected_version
          assert data["validation_profile"] == "m0-strict-0.4.0"
          PY

          python scripts/export_fma_projection.py \
            examples/synthetic-critical-material-pathway/case.json \
            --output-dir build/fma-projection

          FMA_VERSION="0.5.0"
          FMA_WHEEL="frontier_mission_assurance-${FMA_VERSION}-py3-none-any.whl"
          FMA_SHA256="50e9d059d12649ecc572cf14a984305250f70dca0ac88f485d3b44d6ddd00895"
          curl -fsSL \
            "https://github.com/Bridge-Node-7/frontier-mission-assurance/releases/download/v${FMA_VERSION}/${FMA_WHEEL}" \
            -o "${RUNNER_TEMP}/${FMA_WHEEL}"
          printf '%s  %s\n' "$FMA_SHA256" "${RUNNER_TEMP}/${FMA_WHEEL}" | sha256sum -c -
          python -m pip install "PyYAML==6.0.3"
          python -m pip install --no-deps "${RUNNER_TEMP}/${FMA_WHEEL}"
          test "$(fma --version)" = "fma ${FMA_VERSION}"
          fma validate build/fma-projection/assurance-graph.json
          fma decision \
            build/fma-projection/assurance-graph.json \
            build/fma-projection/decision-receipt.json
      - name: Upload consumer and interoperability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-python-3.12
          path: |
            build/consumer-validation.json
            build/guided-decision-passport.md
            build/fma-projection/
            ${{ runner.temp }}/m2m-manifest/
          if-no-files-found: ignore
          retention-days: 14

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Privacy path scan
        run: python scripts/check_privacy.py
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Complete local gate
        run: |
          python scripts/check_repo.py
          git diff --exit-code
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/
            VALIDATION_REPORT.md
          if-no-files-found: ignore
          retention-days: 14
