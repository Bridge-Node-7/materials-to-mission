name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Privacy path scan
        run: python scripts/check_privacy.py
      - name: Follow documented consumer path
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .consumer-venv
          source .consumer-venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(m2m --version)" = "m2m ${EXPECTED_VERSION}"
          python scripts/evaluate_public_method.py
          mkdir -p build
          m2m validate \
            examples/synthetic-critical-material-pathway/case.json \
            --public \
            --profile m0-strict-0.4.0 \
            --json > build/consumer-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/consumer-validation.json").read_text())
          assert data["valid"] is True
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert data["toolkit_version"] == expected_version
          assert data["validation_profile"] == "m0-strict-0.4.0"
          PY
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-python-3.12
          path: |
            build/consumer-validation.json
            build/guided-decision-passport.md
          if-no-files-found: ignore
          retention-days: 14

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Privacy path scan
        run: python scripts/check_privacy.py
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Complete local gate
        run: |
          python scripts/check_repo.py
          git diff --exit-code
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/
            VALIDATION_REPORT.md
          if-no-files-found: ignore
          retention-days: 14
